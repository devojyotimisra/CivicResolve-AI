name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      JWT_ACCESS_TOKEN_EXPIRES_DAYS: "31"
      JWT_SECRET_KEY: ci-test-jwt-secret-key

      COMMISSIONER_MAIL: commissioner@test.local
      COMMISSIONER_PASSWORD: test-password
      COMMISSIONER_NAME: Test Commissioner
      COMMISSIONER_PINCODE: "110001"
      COMMISSIONER_ADDRESS: Test Municipal Office

      FRONTEND_URL: http://localhost:5173
      HOST: 0.0.0.0
      PORT: "8000"
      GEMINI_API_KEY: "dummy-key-for-tests"

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run pytest tests/