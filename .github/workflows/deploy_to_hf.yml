name: Sync Backend to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push Backend directory to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: "devojyotimisra/CS3001" 
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          echo "Cloning the Hugging Face space..."
          git clone https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_NAME /tmp/hf_space
          
          echo "Syncing Backend folder to Space..."
          find /tmp/hf_space -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.gitattributes' -exec rm -rf {} +
          
          cp -r Backend/* /tmp/hf_space/
          cp -r Backend/.* /tmp/hf_space/ 2>/dev/null || true
          
          echo "Committing and pushing to Hugging Face..."
          cd /tmp/hf_space
          git add .
          git commit -m "Sync from GitHub (Commit: ${{ github.sha }})" || echo "No changes to commit"
          git push origin main
