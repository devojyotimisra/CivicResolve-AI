openapi: 3.1.0
info:
  title: CivicResolve AI API
  description: Verified OpenAPI 3.1.0 specification for CivicResolveAI backend endpoints, audited against FastAPI implementation and pytest regression suite.
  version: 0.1.0
tags:
  - name: auth
    description: Authentication and user registration endpoints
  - name: public
    description: Publicly accessible endpoints for anonymous complaints and tracking
  - name: citizen
    description: Citizen role operations including complaints, utility bills, facility bookings, and profile management
  - name: officer
    description: Field officer role operations for ticket management, status updates, resolution, and history
  - name: commissioner
    description: Municipal commissioner administrative operations for system management, user administration, facilities, categories, and analytics



servers:
  - url: http://localhost:8000
    description: Local development server
    

    
paths:
  /api/login:
    post:
      tags:
        - auth
      summary: User login
      description: Authenticate user with email (or badge ID) and password. Returns JWT access token and user details.
      operationId: login_api_login_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: citizen@civicresolve.gov
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/signup:
    post:
      tags:
        - auth
      summary: Citizen registration
      description: Register a new citizen account. Returns JWT access token and user info upon success.
      operationId: signup_api_signup_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: newcitizen@example.com
              password: password123
              name: Jane Doe
              address: 123 Civic Way
              pincode: '560001'
              phone: '9876543210'
      responses:
        '200':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: Invalid input format or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/complaint/anonymous:
    post:
      tags:
        - public
      summary: File anonymous complaint
      description: Submit a complaint anonymously with optional image upload and category assignment.
      operationId: file_anonymous_complaint_api_complaint_anonymous_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnonymousComplaintRequest'
      responses:
        '200':
          description: Complaint filed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousComplaintResponse'
        '400':
          description: Invalid title, description, category, file extension, MIME type, or file size > 10 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/complaint/track/{token}:
    get:
      tags:
        - public
      summary: Track complaint status
      description: Retrieve public complaint status and update history timeline using unique tracking token.
      operationId: track_complaint_api_complaint_track__token__get
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Tracking token (e.g. CRA-ABC12345)
      responses:
        '200':
          description: Complaint track details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackComplaintResponse'
        '404':
          description: Complaint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/citizen/dash:
    get:
      tags:
        - citizen
      summary: Citizen dashboard overview
      description: Fetch citizen dashboard metrics including total bills due, upcoming bookings count, and top 5 lists. Restricts access to citizen role.
      operationId: citizen_dashboard_api_citizen_dash_get
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenDashboardResponse'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Citizen access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/citizen/complaints:
    get:
      tags:
        - citizen
      summary: List citizen complaints
      description: Retrieve complaints with optional status filtering. Restricts access to citizen role.
      operationId: citizen_complaints_list_api_citizen_complaints_get
      security:
        - HTTPBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by status (e.g. Submitted, Resolved)
      responses:
        '200':
          description: List of complaints
          content:
            application/json:
              schema:
                type: object
                properties:
                  complaints:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplaintSummary'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/citizen/complaint/{complaint_id}:
    get:
      tags:
        - citizen
      summary: Get complaint details
      description: Retrieve full details and update timeline for a specific complaint by ID. Restricts access to citizen role.
      operationId: citizen_complaint_detail_api_citizen_complaint__complaint_id__get
      security:
        - HTTPBearer: []
      parameters:
        - name: complaint_id
          in: path
          required: true
          schema:
            type: integer
          description: Complaint ID
      responses:
        '200':
          description: Complaint detail and updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackComplaintResponse'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: Complaint or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/citizen/bills:
    get:
      tags:
        - citizen
      summary: List citizen utility bills
      description: Retrieve utility bills for the citizen with optional status filtering. Restricts access to citizen role.
      operationId: citizen_bills_list_api_citizen_bills_get
      security:
        - HTTPBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by status (e.g. Pending, Paid)
      responses:
        '200':
          description: List of utility bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: '#/components/schemas/UtilityBill'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/citizen/pay_bill/{bill_id}:
    post:
      tags:
        - citizen
      summary: Pay utility bill
      description: Process payment for a pending or overdue utility bill owned by citizen. Restricts access to citizen role.
      operationId: citizen_pay_bill_api_citizen_pay_bill__bill_id__post
      security:
        - HTTPBearer: []
      parameters:
        - name: bill_id
          in: path
          required: true
          schema:
            type: integer
          description: Utility bill ID
      responses:
        '200':
          description: Payment successful with receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayBillResponse'
        '400':
          description: Bill is already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Access denied or citizen access required
        '404':
          description: Bill or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/citizen/facilities:
    get:
      tags:
        - citizen
      summary: List available public facilities
      description: Retrieve list of active public facilities available for booking. Restricts access to citizen role.
      operationId: citizen_facilities_list_api_citizen_facilities_get
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: List of active facilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  facilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found

  /api/citizen/facility/{facility_id}:
    get:
      tags:
        - citizen
      summary: Get facility details and booked dates
      description: Retrieve facility information, along with all booked dates and citizen's own booked dates for the next 90 days. Restricts access to citizen role.
      operationId: citizen_facility_detail_api_citizen_facility__facility_id__get
      security:
        - HTTPBearer: []
      parameters:
        - name: facility_id
          in: path
          required: true
          schema:
            type: integer
          description: Facility ID
      responses:
        '200':
          description: Facility detail and availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDetailResponse'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: Facility or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/citizen/book_facility/{facility_id}:
    post:
      tags:
        - citizen
      summary: Book a facility
      description: Book an active public facility for a specified future date (up to 90 days in advance). Restricts access to citizen role.
      operationId: citizen_book_facility_api_citizen_book_facility__facility_id__post
      security:
        - HTTPBearer: []
      parameters:
        - name: facility_id
          in: path
          required: true
          schema:
            type: integer
          description: Facility ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookFacilityRequest'
      responses:
        '200':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookFacilityResponse'
        '400':
          description: Invalid date, past date, date > 90 days ahead, or date already booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: Facility or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/citizen/bookings:
    get:
      tags:
        - citizen
      summary: List citizen facility bookings
      description: Retrieve history of facility bookings for authenticated citizen. Restricts access to citizen role.
      operationId: citizen_bookings_list_api_citizen_bookings_get
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacilityBooking'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found

  /api/citizen/cancel_booking/{booking_id}:
    post:
      tags:
        - citizen
      summary: Cancel facility booking
      description: Cancel an upcoming active facility booking owned by citizen. Restricts access to citizen role.
      operationId: citizen_cancel_booking_api_citizen_cancel_booking__booking_id__post
      security:
        - HTTPBearer: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
          description: Booking ID
      responses:
        '200':
          description: Booking cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Booking already cancelled or booking date in past
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Access denied or citizen access required
        '404':
          description: Booking or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/citizen/search:
    post:
      tags:
        - citizen
      summary: Search active facilities
      description: Search facilities by name, address, facility type, or pincode. Restricts access to citizen role.
      operationId: citizen_search_api_citizen_search_post
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQueryRequest'
      responses:
        '200':
          description: Matching facilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  facilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/citizen/profile:
    get:
      tags:
        - citizen
      summary: Fetch citizen profile
      description: Retrieve profile details for authenticated citizen. Restricts access to citizen role.
      operationId: citizen_profile_fetch_api_citizen_profile_get
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Citizen profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenProfile'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found

  /api/citizen/edit_profile:
    put:
      tags:
        - citizen
      summary: Update citizen profile
      description: Update profile fields such as email, name, address, pincode, phone, or password. Restricts access to citizen role.
      operationId: citizen_profile_update_api_citizen_edit_profile_put
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid field format or length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/officer/dash:
    get:
      tags:
        - officer
      summary: Field officer dashboard
      description: Retrieve officer info and active assigned ticket complaints. Restricts access to field_officer role.
      operationId: officer_dashboard_api_officer_dash_get
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Officer dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerDashboardResponse'
        '401':
          description: Unauthorized
        '403':
          description: Officer access required
        '404':
          description: User not found

  /api/officer/ticket/{complaint_id}:
    get:
      tags:
        - officer
      summary: Get assigned ticket detail
      description: Retrieve details and timeline for a complaint assigned to the authenticated officer. Restricts access to field_officer role.
      operationId: officer_ticket_detail_api_officer_ticket__complaint_id__get
      security:
        - HTTPBearer: []
      parameters:
        - name: complaint_id
          in: path
          required: true
          schema:
            type: integer
          description: Complaint ticket ID
      responses:
        '200':
          description: Ticket detail and updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerTicketDetailResponse'
        '401':
          description: Unauthorized
        '403':
          description: Ticket not assigned to officer or non-officer access
        '404':
          description: Complaint or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/officer/ticket/{complaint_id}/status:
    put:
      tags:
        - officer
      summary: Update ticket status
      description: Advance ticket status following strict lifecycle rules (Assigned -> En Route -> On Site -> In Progress -> Resolved). Restricts access to field_officer role.
      operationId: officer_update_ticket_status_api_officer_ticket__complaint_id__status_put
      security:
        - HTTPBearer: []
      parameters:
        - name: complaint_id
          in: path
          required: true
          schema:
            type: integer
          description: Complaint ticket ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketStatusRequest'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing status or invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Ticket not assigned to officer or non-officer access
        '404':
          description: Complaint or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/officer/ticket/{complaint_id}/resolve:
    post:
      tags:
        - officer
      summary: Resolve ticket
      description: Mark ticket status as Resolved with optional resolution note and photo URL. Must be in progress or on site. Restricts access to field_officer role.
      operationId: officer_resolve_ticket_api_officer_ticket__complaint_id__resolve_post
      security:
        - HTTPBearer: []
      parameters:
        - name: complaint_id
          in: path
          required: true
          schema:
            type: integer
          description: Complaint ticket ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTicketRequest'
      responses:
        '200':
          description: Ticket resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Ticket must be in progress or on site to resolve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Ticket not assigned to officer or non-officer access
        '404':
          description: Complaint or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/officer/history:
    get:
      tags:
        - officer
      summary: Officer ticket history
      description: Retrieve history of all tickets assigned to the field officer (active and resolved). Restricts access to field_officer role.
      operationId: officer_history_api_officer_history_get
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: History ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfficerTicketItem'
        '401':
          description: Unauthorized
        '403':
          description: Officer access required
        '404':
          description: User not found

  /api/officer/search:
    post:
      tags:
        - officer
      summary: Search officer tickets
      description: Search officer's assigned tickets by title, token, location, or description. Restricts access to field_officer role.
      operationId: officer_search_api_officer_search_post
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQueryRequest'
      responses:
        '200':
          description: Matching tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfficerTicketItem'
        '401':
          description: Unauthorized
        '403':
          description: Officer access required
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/officer/profile:
    get:
      tags:
        - officer
      summary: Fetch officer profile
      description: Retrieve profile info of authenticated field officer. Restricts access to field_officer role.
      operationId: officer_profile_fetch_api_officer_profile_get
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Officer profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerProfile'
        '401':
          description: Unauthorized
        '403':
          description: Officer access required
        '404':
          description: User not found

  /api/officer/edit_profile:
    put:
      tags:
        - officer
      summary: Update officer profile
      description: Update profile fields such as name, phone, or password. Restricts access to field_officer role.
      operationId: officer_profile_update_api_officer_edit_profile_put
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficerProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation failure
        '401':
          description: Unauthorized
        '403':
          description: Officer access required
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/commissioner/dash:
    get:
      tags:
        - commissioner
      summary: Commissioner dashboard
      description: Retrieve municipal analytics overview (total, pending, resolved, closed, critical complaints, officer/citizen counts, total revenue). Restricts access to commissioner role.
      operationId: commissioner_dashboard_api_commissioner_dash_get
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Commissioner dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionerDashboardResponse'
        '401':
          description: Unauthorized
        '403':
          description: Commissioner access required
        '404':
          description: User not found

  /api/commissioner/complaints:
    get:
      tags:
        - commissioner
      summary: List all complaints
      description: Retrieve system-wide complaints with optional status and department filters. Restricts access to commissioner role.
      operationId: commissioner_complaints_list_api_commissioner_complaints_get
      security:
        - HTTPBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by status
        - name: department_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by department ID
      responses:
        '200':
