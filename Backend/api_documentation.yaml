components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      description: JSON Web Token (JWT) Bearer authentication header. Format `Bearer
        <token>`
  schemas:
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          description: User email or officer badge ID
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            name:
              type: string
            role:
              type: string
              enum:
              - citizen
              - officer
              - commissioner
            badgeId:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            department:
              type: string
              nullable: true
    SignupRequest:
      type: object
      required:
      - email
      - password
      - name
      - address
      - pincode
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        address:
          type: string
        pincode:
          type: string
        phone:
          type: string
          nullable: true
    SignupResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            name:
              type: string
            role:
              type: string
              example: citizen
    AnonymousComplaintRequest:
      type: object
      required:
      - title
      - description
      properties:
        title:
          type: string
        description:
          type: string
        category_id:
          type: integer
          nullable: true
        address_text:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        photo:
          type: string
          format: binary
          nullable: true
    AnonymousComplaintResponse:
      type: object
      properties:
        message:
          type: string
          example: Complaint filed successfully
        tracking_token:
          type: string
          example: CRA-ABC12345
        trackingToken:
          type: string
          example: CRA-ABC12345
        complaint_id:
          type: integer
          example: 101
        complaintId:
          type: integer
          example: 101
      description: Response containing complaint creation confirmation and generated
        tracking tokens. Intentionally returns both snake_case and camelCase field
        names for backward compatibility.
      required:
      - message
      - tracking_token
      - trackingToken
      - complaint_id
      - complaintId
    TrackComplaintResponse:
      type: object
      properties:
        complaint:
          $ref: '#/components/schemas/ComplaintDetail'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintUpdateItem'
    CitizenDashboardResponse:
      type: object
      properties:
        user_name:
          type: string
          example: Jane Doe
        total_bills_due:
          type: integer
          example: 2
        upcoming_bookings_count:
          type: integer
          example: 1
        pending_bills:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              bill_type:
                type: string
                example: Water
              bill_number:
                type: string
                example: B-1001
              amount:
                type: number
                example: 250.0
              due_date:
                type: string
                example: '2026-08-15'
              status:
                type: string
                example: Pending
            required:
            - id
            - bill_type
            - bill_number
            - amount
            - due_date
            - status
        upcoming_bookings:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              facility_name:
                type: string
                example: Community Hall
              date:
                type: string
                example: '2026-08-10'
              booking_reference:
                type: string
                example: BK-001
              amount_paid:
                type: number
                example: 500.0
              status:
                type: string
                example: Confirmed
            required:
            - id
            - facility_name
            - date
            - booking_reference
            - amount_paid
            - status
      required:
      - user_name
      - total_bills_due
      - upcoming_bookings_count
      - pending_bills
      - upcoming_bookings
    ComplaintDetail:
      type: object
      properties:
        id:
          type: integer
          example: 101
        token:
          type: string
          example: CRA-ABC12345
        title:
          type: string
          example: Broken streetlight
        description:
          type: string
          example: The streetlight near the park is not working.
        category:
          type: string
          nullable: true
          example: Streetlight
        submitted_photo:
          type: string
          nullable: true
          example: null
        location:
          type: string
          nullable: true
          example: Main Road, Sector 7
        status:
          type: string
          example: Submitted
        severity:
          type: string
          example: Normal
        resolution_photo:
          type: string
          nullable: true
          example: null
        resolution_note:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          nullable: true
          example: '2026-08-01T10:00:00Z'
        updated_at:
          type: string
          nullable: true
          example: '2026-08-01T10:00:00Z'
        resolved_at:
          type: string
          nullable: true
          example: null
        closed_at:
          type: string
          nullable: true
          example: null
      required:
      - id
      - token
      - title
      - description
      - status
      - severity
    ComplaintUpdateItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        old_status:
          type: string
          nullable: true
          example: null
        new_status:
          type: string
          example: Submitted
        note:
          type: string
          nullable: true
          example: Complaint filed
        created_at:
          type: string
          nullable: true
          example: '2026-08-01T10:00:00Z'
      required:
      - id
      - new_status
    UtilityBill:
      type: object
      properties:
        id:
          type: integer
          example: 1
        citizen_name:
          type: string
          nullable: true
          example: Jane Doe
        bill_type:
          type: string
          example: Water
        bill_number:
          type: string
          example: B-1001
        amount:
          type: number
          example: 250.0
        due_date:
          type: string
          example: '2026-08-15'
        period:
          type: string
          nullable: true
          example: 2026-08
        status:
          type: string
          example: Pending
        generated_at:
          type: string
          nullable: true
          example: '2026-08-01'
        paid_at:
          type: string
          nullable: true
          example: null
        payment_ref:
          type: string
          nullable: true
          example: null
      required:
      - id
      - bill_type
      - bill_number
      - amount
      - due_date
      - status
    PayBillResponse:
      type: object
      properties:
        message:
          type: string
        receipt:
          type: object
          properties:
            billNumber:
              type: string
            billType:
              type: string
            amount:
              type: number
            paidAt:
              type: string
              format: date-time
            transactionId:
              type: string
    Facility:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Town Hall
        facility_type:
          type: string
          example: Auditorium
        address:
          type: string
          example: Main Street
        pincode:
          type: string
          example: '560001'
        price_per_day:
          type: number
          example: 500.0
        capacity:
          type: integer
          nullable: true
          example: 200
        description:
          type: string
          nullable: true
          example: Community hall
        amenities:
          type: object
          nullable: true
          example:
            ac: true
        is_active:
          type: boolean
          example: true
      required:
      - id
      - name
      - facility_type
      - address
      - pincode
      - price_per_day
      - is_active
    FacilityDetailResponse:
      type: object
