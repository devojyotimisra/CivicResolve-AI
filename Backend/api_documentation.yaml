components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      description: JSON Web Token (JWT) Bearer authentication header. Format `Bearer <token>`

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User email or officer badge ID
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            name:
              type: string
            role:
              type: string
              enum: [citizen, officer, commissioner]
            badgeId:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            department:
              type: string
              nullable: true

    SignupRequest:
      type: object
      required:
        - email
        - password
        - name
        - address
        - pincode
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        address:
          type: string
        pincode:
          type: string
        phone:
          type: string
          nullable: true

    SignupResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            name:
              type: string
            role:
              type: string
              example: citizen

    AnonymousComplaintRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
        category_id:
          type: integer
          nullable: true
        address_text:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        photo:
          type: string
          format: binary
          nullable: true

    AnonymousComplaintResponse:
      type: object
      properties:
        message:
          type: string
        tracking_token:
          type: string
        trackingToken:
          type: string
        complaint_id:
          type: integer
        complaintId:
          type: integer

    TrackComplaintResponse:
      type: object
      properties:
        complaint:
          $ref: '#/components/schemas/ComplaintDetail'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintUpdateItem'

    CitizenDashboardResponse:
      type: object
      properties:
        user_name:
          type: string
        total_bills_due:
          type: integer
        upcoming_bookings_count:
          type: integer
        pending_bills:
          type: array
          items:
            $ref: '#/components/schemas/UtilityBill'
        upcoming_bookings:
          type: array
          items:
            $ref: '#/components/schemas/FacilityBooking'

    ComplaintSummary:
      type: object
      properties:
        id:
          type: integer
        token:
          type: string
        tracking_token:
          type: string
        title:
          type: string
        category:
          type: string
          nullable: true
        status:
          type: string
        severity:
          type: string
        priority:
          type: string
        created_at:
