openapi: 3.1.0
info:
  title: CivicResolve AI API
  description: Verified OpenAPI 3.1.0 specification for CivicResolveAI backend endpoints,
    audited against FastAPI implementation and pytest regression suite.
  version: 0.1.0
tags:
- name: auth
  description: Authentication and user registration endpoints
- name: public
  description: Publicly accessible endpoints for anonymous complaints and tracking
- name: citizen
  description: Citizen role operations including complaints, utility bills, facility
    bookings, and profile management
- name: officer
  description: Field officer role operations for ticket management, status updates,
    resolution, and history
- name: commissioner
  description: Municipal commissioner administrative operations for system management,
    user administration, facilities, categories, and analytics
servers:
- url: http://localhost:8000
  description: Local development server
paths:
  /api/login:
    post:
      tags:
      - auth
      summary: User login
      description: Authenticate user with email (or badge ID) and password. Returns
        JWT access token and user details.
      operationId: login_api_login_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: citizen@civicresolve.gov
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: Login successful
                token: jwt-token
                user:
                  id: 1
                  email: citizen@civicresolve.gov
                  name: Jane Doe
                  role: citizen
                  badgeId: null
                  phone: '9876543210'
                  department: null
        '400':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/signup:
    post:
      tags:
      - auth
      summary: Citizen registration
      description: Register a new citizen account. Returns JWT access token and user
        info upon success.
      operationId: signup_api_signup_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: newcitizen@example.com
              password: password123
              name: Jane Doe
              address: 123 Civic Way
              pincode: '560001'
              phone: '9876543210'
      responses:
        '200':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              example:
                message: Account created successfully
                token: jwt-token
                user:
                  id: 2
                  email: newcitizen@example.com
                  name: Jane Doe
                  role: citizen
        '400':
          description: Invalid input format or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/complaint/anonymous:
    post:
      tags:
      - public
      summary: File anonymous complaint
      description: Submit a complaint anonymously with optional image upload and category
        assignment.
      operationId: file_anonymous_complaint_api_complaint_anonymous_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnonymousComplaintRequest'
            example:
              title: Broken streetlight
              description: The streetlight near the park is not working.
              category_id: 1
              address_text: Main Road, Sector 7
              latitude: 12.9716
              longitude: 77.5946
              photo: binary-file
      responses:
        '200':
          description: Complaint filed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousComplaintResponse'
              example:
                message: Complaint filed successfully
                tracking_token: CRA-ABC12345
                trackingToken: CRA-ABC12345
                complaint_id: 101
                complaintId: 101
        '400':
          description: Invalid title, description, category, file extension, MIME
            type, or file size > 10 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/complaint/track/{token}:
    get:
      tags:
      - public
      summary: Track complaint status
      description: Retrieve public complaint status and update history timeline using
        unique tracking token.
      operationId: track_complaint_api_complaint_track__token__get
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Tracking token (e.g. CRA-ABC12345)
      responses:
        '200':
          description: Complaint track details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackComplaintResponse'
              example:
                complaint:
                  id: 101
                  token: CRA-ABC12345
                  title: Broken streetlight
                  description: The streetlight near the park is not working.
                  category: Streetlight
                  submitted_photo: null
                  location: Main Road, Sector 7
                  status: Submitted
                  severity: Normal
                  resolution_photo: null
                  resolution_note: null
                  created_at: '2026-08-01T10:00:00Z'
                  updated_at: '2026-08-01T10:00:00Z'
                  resolved_at: null
                  closed_at: null
                updates:
                - id: 1
                  old_status: null
                  new_status: Submitted
                  note: Complaint filed
                  created_at: '2026-08-01T10:00:00Z'
        '404':
          description: Complaint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/citizen/dash:
    get:
      tags:
      - citizen
      summary: Citizen dashboard overview
      description: Fetch citizen dashboard metrics including total bills due, upcoming
        bookings count, and top 5 lists. Restricts access to citizen role.
      operationId: citizen_dashboard_api_citizen_dash_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenDashboardResponse'
              example:
                user_name: Jane Doe
                total_bills_due: 2
                upcoming_bookings_count: 1
                pending_bills:
                - id: 1
                  bill_type: Water
                  bill_number: B-1001
                  amount: 250.0
                  due_date: '2026-08-15'
                  status: Pending
                upcoming_bookings:
                - id: 1
                  facility_name: Community Hall
                  date: '2026-08-10'
                  booking_reference: BK-001
                  amount_paid: 500.0
                  status: Confirmed
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Citizen access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/citizen/bills:
    get:
      tags:
      - citizen
      summary: List citizen utility bills
      description: Retrieve utility bills for the citizen with optional status filtering.
        Restricts access to citizen role.
      operationId: citizen_bills_list_api_citizen_bills_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Filter by status (e.g. Pending, Paid)
      responses:
        '200':
          description: List of utility bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: '#/components/schemas/UtilityBill'
              example:
                bills:
                - id: 1
                  bill_type: Water
                  billType: Water
                  bill_number: B-1001
                  billNumber: B-1001
                  amount: 250.0
                  due_date: '2026-08-15'
                  dueDate: '2026-08-15'
                  period: 2026-08
                  status: Pending
                  citizenName: Jane Doe
                  citizenId: 1
                  paidAt: null
                  createdAt: '2026-08-01T09:00:00Z'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/citizen/pay_bill/{bill_id}:
    post:
      tags:
      - citizen
      summary: Pay utility bill
      description: Process payment for a pending or overdue utility bill owned by
        citizen. Restricts access to citizen role.
      operationId: citizen_pay_bill_api_citizen_pay_bill__bill_id__post
      security:
      - HTTPBearer: []
      parameters:
      - name: bill_id
        in: path
        required: true
        schema:
          type: integer
        description: Utility bill ID
      responses:
        '200':
          description: Payment successful with receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayBillResponse'
              example:
                message: Payment successful
                receipt:
                  billNumber: B-1001
                  billType: Water
                  amount: 250.0
                  paidAt: '2026-08-01T10:30:00Z'
                  transactionId: TXN-001
        '400':
          description: Bill is already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Access denied or citizen access required
        '404':
          description: Bill or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/citizen/facilities:
    get:
      tags:
      - citizen
      summary: List available public facilities
      description: Retrieve list of active public facilities available for booking.
        Restricts access to citizen role.
      operationId: citizen_facilities_list_api_citizen_facilities_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: List of active facilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  facilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
              example:
                facilities:
                - id: 1
                  name: Community Hall
                  facilityType: Event
                  facility_type: Event
                  address: 123 Civic Way
                  pincode: '560001'
                  pricePerDay: 500.0
                  price_per_day: 500.0
                  capacity: 100
                  description: Multi-purpose community facility
                  amenities:
                    parking: true
                    wifi: true
                  isActive: true
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
  /api/citizen/facility/{facility_id}:
    get:
      tags:
      - citizen
      summary: Get facility details and booked dates
      description: Retrieve facility information, along with all booked dates and
        citizen's own booked dates for the next 90 days. Restricts access to citizen
        role.
      operationId: citizen_facility_detail_api_citizen_facility__facility_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: facility_id
        in: path
        required: true
        schema:
          type: integer
        description: Facility ID
      responses:
        '200':
          description: Facility detail and availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDetailResponse'
              example:
                facility:
                  id: 1
                  name: Community Hall
                  facilityType: Event
                  facility_type: Event
                  address: 123 Civic Way
                  pincode: '560001'
                  pricePerDay: 500.0
                  price_per_day: 500.0
                  capacity: 100
                  description: Multi-purpose community facility
                  amenities:
                    parking: true
                    wifi: true
                  isActive: true
                booked_dates:
                - '2026-08-10'
                my_booked_dates:
                - '2026-08-10'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: Facility or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/citizen/book_facility/{facility_id}:
    post:
      tags:
      - citizen
      summary: Book a facility
      description: Book an active public facility for a specified future date (up
        to 90 days in advance). Restricts access to citizen role.
      operationId: citizen_book_facility_api_citizen_book_facility__facility_id__post
      security:
      - HTTPBearer: []
      parameters:
      - name: facility_id
        in: path
        required: true
        schema:
          type: integer
        description: Facility ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookFacilityRequest'
            example:
              booked_date: '2026-08-10'
              bookedDate: '2026-08-10'
              date: '2026-08-10'
              purpose: Meeting
      responses:
        '200':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookFacilityResponse'
              example:
                message: Booking confirmed
                booking:
                  id: 1
                  bookingReference: BK-001
                  facilityName: Community Hall
                  bookedDate: '2026-08-10'
                  amountPaid: 500.0
                  purpose: Meeting
                  status: Confirmed
        '400':
          description: Invalid date, past date, date > 90 days ahead, or date already
            booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: Facility or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/citizen/bookings:
    get:
      tags:
      - citizen
      summary: List citizen facility bookings
      description: Retrieve history of facility bookings for authenticated citizen.
        Restricts access to citizen role.
      operationId: citizen_bookings_list_api_citizen_bookings_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacilityBooking'
              example:
                bookings:
                - id: 1
                  facility_name: Community Hall
                  facilityName: Community Hall
                  facilityType: Event
                  booked_date: '2026-08-10'
                  bookedDate: '2026-08-10'
                  date: '2026-08-10'
                  booking_reference: BK-001
                  bookingReference: BK-001
                  amount_paid: 500.0
                  amountPaid: 500.0
                  purpose: Meeting
                  status: Confirmed
                  createdAt: '2026-08-01T09:00:00Z'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
  /api/citizen/cancel_booking/{booking_id}:
    post:
      tags:
      - citizen
      summary: Cancel facility booking
      description: Cancel an upcoming active facility booking owned by citizen. Restricts
        access to citizen role.
      operationId: citizen_cancel_booking_api_citizen_cancel_booking__booking_id__post
      security:
      - HTTPBearer: []
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: integer
        description: Booking ID
      responses:
        '200':
          description: Booking cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Booking cancelled successfully
        '400':
          description: Booking already cancelled or booking date in past
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Access denied or citizen access required
        '404':
          description: Booking or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/citizen/search:
    post:
      tags:
      - citizen
      summary: Search active facilities
      description: Search facilities by name, address, facility type, or pincode.
        Restricts access to citizen role.
      operationId: citizen_search_api_citizen_search_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQueryRequest'
            example:
              query: community hall
      responses:
        '200':
          description: Matching facilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  facilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
              example:
                facilities:
                - id: 1
                  name: Community Hall
                  facilityType: Event
                  facility_type: Event
                  address: 123 Civic Way
                  pincode: '560001'
                  pricePerDay: 500.0
                  price_per_day: 500.0
                  capacity: 100
                  description: Multi-purpose community facility
                  amenities:
                    parking: true
                    wifi: true
                  isActive: true
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/citizen/profile:
    get:
      tags:
      - citizen
      summary: Fetch citizen profile
      description: Retrieve profile details for authenticated citizen. Restricts access
        to citizen role.
      operationId: citizen_profile_fetch_api_citizen_profile_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Citizen profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenProfile'
              example:
                id: 1
                email: citizen@civicresolve.gov
                name: Jane Doe
                phone: '9876543210'
                address: 123 Civic Way
                pincode: '560001'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
  /api/citizen/edit_profile:
    put:
      tags:
      - citizen
      summary: Update citizen profile
      description: Update profile fields such as email, name, address, pincode, phone,
        or password. Restricts access to citizen role.
      operationId: citizen_profile_update_api_citizen_edit_profile_put
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenProfileUpdate'
            example:
              email: citizen@civicresolve.gov
              name: Jane Doe
              address: 123 Civic Way
              pincode: '560001'
              phone: '9876543210'
              password: newpassword123
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Profile updated successfully
        '400':
          description: Invalid field format or length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Citizen access required
        '404':
          description: User not found
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/officer/dash:
    get:
      tags:
      - officer
      summary: Field officer dashboard
      description: Retrieve officer info and active assigned ticket complaints. Restricts
        access to field_officer role.
      operationId: officer_dashboard_api_officer_dash_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Officer dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerDashboardResponse'
              example:
                officer_name: Officer Singh
                department: Public Works
                jurisdiction_zone: Zone A
                assigned_tickets:
                - id: 101
                  token: CRA-ABC12345
                  title: Broken streetlight
                  description: The streetlight near the park is not working.
                  department: Public Works
                  location: Main Road, Sector 7
                  status: Assigned
                  severity: Normal
                  submittedPhoto: null
                  resolutionPhoto: null
                  resolutionNote: null
                  resolvedAt: null
                  createdAt: '2026-08-01T10:00:00Z'
                total_assigned: 1
        '401':
          description: Unauthorized
        '403':
          description: Officer access required
        '404':
          description: User not found
  /api/officer/ticket/{complaint_id}:
    get:
      tags:
      - officer
      summary: Get assigned ticket detail
      description: Retrieve details and timeline for a complaint assigned to the authenticated
        officer. Restricts access to field_officer role.
      operationId: officer_ticket_detail_api_officer_ticket__complaint_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: complaint_id
        in: path
        required: true
        schema:
          type: integer
        description: Complaint ticket ID
      responses:
        '200':
          description: Ticket detail and updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerTicketDetailResponse'
              example:
                complaint:
                  id: 101
                  token: CRA-ABC12345
                  title: Broken streetlight
                  description: The streetlight near the park is not working.
                  category: Streetlight
                  department: Public Works
                  departmentId: 2
                  submitted_photo: null
                  submittedPhoto: null
                  location: Main Road, Sector 7
                  status: Assigned
                  severity: Normal
                  assignedOfficer: Officer Singh
                  assignedOfficerId: 10
                  resolution_photo: null
                  resolutionPhoto: null
                  resolution_note: null
                  resolutionNote: null
                  created_at: '2026-08-01T10:00:00Z'
                  createdAt: '2026-08-01T10:00:00Z'
                  updated_at: '2026-08-01T10:00:00Z'
                  updatedAt: '2026-08-01T10:00:00Z'
                  resolved_at: null
                  resolvedAt: null
                  closed_at: null
                  closedAt: null
                updates:
                - id: 1
                  old_status: null
                  oldStatus: null
                  new_status: Assigned
                  newStatus: Assigned
                  note: Assigned to officer
                  updatedBy: Commissioner
                  created_at: '2026-08-01T10:00:00Z'
                  createdAt: '2026-08-01T10:00:00Z'
        '401':
          description: Unauthorized
        '403':
          description: Ticket not assigned to officer or non-officer access
        '404':
          description: Complaint or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/officer/ticket/{complaint_id}/status:
    put:
      tags:
      - officer
      summary: Update ticket status
      description: Advance ticket status following strict lifecycle rules (Assigned
        -> En Route -> On Site -> In Progress -> Resolved). Restricts access to field_officer
        role.
      operationId: officer_update_ticket_status_api_officer_ticket__complaint_id__status_put
      security:
      - HTTPBearer: []
      parameters:
      - name: complaint_id
        in: path
        required: true
        schema:
          type: integer
        description: Complaint ticket ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketStatusRequest'
            example:
              status: In Progress
              note: On site inspection completed
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Status updated successfully
        '400':
          description: Missing status or invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Ticket not assigned to officer or non-officer access
        '404':
          description: Complaint or User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
